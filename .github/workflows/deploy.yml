name: CI & Deploy su Cloud1 Plesk (mosaic.emanueletolomei.it)

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    name: Test Automatici & Deploy Plesk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql, curl, json

      - name: Esecuzione Suite Test Automatici (31/31)
        run: php artisan test

      - name: Deploy automatico su Cloud1 Plesk via Webhook Git
        env:
          PLESK_WEBHOOK_URL: ${{ secrets.PLESK_WEBHOOK_URL }}
        run: |
          if [ -z "$PLESK_WEBHOOK_URL" ]; then
            echo "::error::Secret PLESK_WEBHOOK_URL non configurato"
            exit 1
          fi
          HTTP_CODE=$(curl -k -sS -o /dev/null -w "%{http_code}" -X POST "$PLESK_WEBHOOK_URL")
          echo "Plesk Git Webhook trigger completato (HTTP $HTTP_CODE)"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "204" ]; then
            echo "::error::Deploy Plesk Git Webhook fallito con codice HTTP $HTTP_CODE"
            exit 1
          fi

